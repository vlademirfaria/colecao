name: CI Pipeline

on:
  push:
    branches: [ "main", "atividade-somativa-2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Baixar dependências
        working-directory: ./backend
        run: go mod download

      - name: Executar testes unitários
        working-directory: ./backend
        run: go test -v ./...

      - name: jscpd-copy-paste-detector
        uses: kucherenko/jscpd@v5.0.16
        with:
          args: "--threshold 0"
